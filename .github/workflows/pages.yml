# public/ をそのまま GitHub Pages に公開する (サーバー不要の静的サイト)
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 中継サーバー (proxy/ の Cloudflare Worker) の URL をサイトに教える。
      # API キーそのものは Worker の secret にだけあり、ここにもサイトにも出ない。
      # repository variable PROXY_URL が無ければ config.json を置かない (各自がキーを入れる方式)。
      - name: Write config.json (proxy URL only)
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          if [ -n "$PROXY_URL" ]; then
            printf '{"proxyUrl":"%s"}\n' "$PROXY_URL" > public/config.json
            echo "config.json: proxyUrl=$PROXY_URL"
          else
            rm -f public/config.json
            echo "no PROXY_URL variable: visitors must enter their own key"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
