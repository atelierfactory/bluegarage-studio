# BLUE GARAGE STUDIO の API 中継サーバー (Cloudflare Worker) の設定
# 配置: このフォルダで `npx wrangler deploy` (先に `npx wrangler login`)
# 秘密の値は wrangler.toml には書かない: `npx wrangler secret put ANTHROPIC_API_KEY` / `npx wrangler secret put PASSCODE`
name = "bluegarage-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# このサイトからしか受け付けない (カンマ区切り)。手元で試すときは http://localhost:5180 を足す
ALLOWED_ORIGINS = "https://atelierfactory.github.io"
# 1 日の上限: 曲 (設計図) の数。トラック生成は SONG_LIMIT×15 回、その他は 3000 回が既定 (TRACK_LIMIT / OTHER_LIMIT で変更可)
SONG_LIMIT = "20"
# 「1 日」の区切り: UTC からのずらし時間 (9 = 日本時間の 0 時で切り替わる)
DAILY_TZ_OFFSET = "9"

# 日ごとの回数を数える KV。`npx wrangler kv namespace create COUNTERS` で作り、出てきた id をここに入れる
[[kv_namespaces]]
binding = "COUNTERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# IP ごとの回数制限: 1 分あたり 20 リクエスト (Workers の Rate Limiting binding)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
