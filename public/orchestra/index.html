<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="/ga.js"></script><link rel="canonical" href="https://atelierfactory.jp/device/jukebox/orchestra/"><!-- アクセス解析 (atelierfactory.jp の /ga.js。ほかの住所では 404 で何もしない) -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VESPER ORCHESTRA</title>
<!-- 検索と共有の紹介（文は部屋の作品カードと同じ） -->
<meta name="description" content="48体のロボットが、ベートーヴェン「運命」の第1楽章を演奏する。本物の楽譜どおりに、奏者47体と指揮者1体がそれぞれのパートに合わせて動く。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="aTELiER FACTORY" />
<meta property="og:title" content="VESPER ORCHESTRA" />
<meta property="og:description" content="48体のロボットが、ベートーヴェン「運命」の第1楽章を演奏する。本物の楽譜どおりに、奏者47体と指揮者1体がそれぞれのパートに合わせて動く。" />
<meta property="og:url" content="https://atelierfactory.jp/device/jukebox/orchestra/" />
<meta property="og:image" content="https://atelierfactory.jp/device/jukebox/orchestra/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<!-- 外の CDN は使わない: フォント・three.js は ../vendor に同梱 -->
<link rel="stylesheet" href="../vendor/fonts/fonts.css" />
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../piano/style.css" />
<link rel="stylesheet" href="../phone.css" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
</head>
<body class="piano-app orchestra-app">
<div id="grain"></div>

<header id="topbar">
  <div class="logo-block">
    <div class="logo">VESPER<span>ORCHESTRA</span></div>
    <div class="logo-sub" data-ui="logo.sub"></div>
  </div>
  <div class="transport">
    <button id="btn-rew" class="tbtn" data-ui-title="transport.rew">⏮</button>
    <button id="btn-play" class="tbtn play" data-ui-title="transport.play">&#x25B6;&#xFE0E;</button>
    <button id="btn-stop" class="tbtn" data-ui-title="transport.stop">■</button>
    <div class="lcd"><span id="pos-display">001.1</span><span class="lcd-time" id="time-display">0:00.0 / 0:00</span></div>
  </div>
  <div class="topbar-right">
    <label class="tfield master"><span>VOL</span><input id="inp-master" data-ui-aria="vol.aria" type="range" min="-40" max="6" step="0.5" value="0" /></label>
    <div class="btn-group">
      <button id="btn-export-wav" class="gbtn tiny" data-ui-title="export.wav">WAV</button>
      <button id="btn-thanks" class="gbtn tiny" data-ui-title="credits.tip">♥</button>
      <a class="gbtn tiny" href="../piano/" data-ui-title="link.piano">PIANO</a>
      <a class="gbtn tiny" href="../band/" data-ui-title="link.band">BAND</a>
    </div>
  </div>
</header>

<div id="workspace">
  <main id="center">
    <div id="proll-head">
      <span id="proll-title" class="song-title">—</span>
      <span class="legend" aria-hidden="true"><span class="ramp"></span><span class="lg-txt">pp – ff</span><span class="sw lit"></span></span>
    </div>
    <div id="proll-wrap" class="view view-active"><canvas id="lanes" data-ui-aria="lanes.aria"></canvas></div>

    <div id="prompt-bar">
      <button id="btn-songs" class="gbtn accent" data-ui="songs.button" data-ui-title="songs.tip"></button>
      <span id="play-hint" class="dim"></span>
    </div>
    <div id="status-bar"><span id="status-text" role="status" aria-live="polite"></span></div>
  </main>

  <aside id="aipanel">
    <div id="stage">
      <canvas id="stage-canvas" data-ui-aria="stage.aria"></canvas>
      <div id="stage-hud"><span id="stage-title"></span><span id="stage-info"></span></div>
      <div id="stage-tools">
        <button class="vbtn on" data-view="wide" data-ui="view.wide" data-ui-title="view.wide.tip"></button>
        <button class="vbtn" data-view="front" data-ui="view.front" data-ui-title="view.front.tip"></button>
        <button class="vbtn" data-view="top" data-ui="view.top" data-ui-title="view.top.tip"></button>
        <button class="vbtn" data-view="conductor" data-ui="view.conductor" data-ui-title="view.conductor.tip"></button>
        <button id="btn-fullscreen" class="vbtn" data-ui="fullscreen" data-ui-title="fullscreen.tip"></button>
      </div>
      <div id="stage-close" data-ui-aria="close.aria">
        <button class="cbtn vbtn on" data-close="auto" data-ui="close.auto"></button>
        <button class="cbtn vbtn" data-close="strings" data-ui="close.strings"></button>
        <button class="cbtn vbtn" data-close="woodwinds" data-ui="close.woodwinds"></button>
        <button class="cbtn vbtn" data-close="brass" data-ui="close.brass"></button>
        <button class="cbtn vbtn" data-close="timpani" data-ui="close.timpani"></button>
        <button class="cbtn vbtn" data-close="conductor" data-ui="close.conductor"></button>
      </div>
      <div id="stage-label-hands"></div>
    </div>
  </aside>
</div>

<dialog id="dlg-songs" class="wide">
  <h3 data-ui="songs.title"></h3>
  <div id="lib-list" class="lib-list"></div>
  <div class="dlg-foot"><button id="btn-songs-close" class="gbtn small" data-ui="close"></button></div>
</dialog>

<dialog id="dlg-thanks" class="wide">
  <h3 data-ui="credits.title"></h3>
  <div class="thanks">
    <p data-ui="credits.samples"></p>
    <p data-ui="credits.score"></p>
    <p data-ui="credits.robots"></p>
    <p class="dim" data-ui="credits.line"></p>
  </div>
  <div class="dlg-foot"><button id="btn-thanks-close" class="gbtn small" data-ui="close" autofocus></button></div>
</dialog>

<div id="toast"></div>
<div id="loader" class="hidden"><div class="loader-inner"><div class="spinner"></div><span id="loader-text">…</span></div></div>

<script type="module" src="orchestra.js"></script>
</body>
</html>
