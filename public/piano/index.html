<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VESPER PIANO — ロボットが弾くピアノ</title>
<!-- 外の CDN は使わない: フォント・Tone.js・three.js は ../vendor に同梱 -->
<link rel="stylesheet" href="../vendor/fonts/fonts.css" />
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="style.css" />
<script src="../vendor/Tone.js"></script>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
</head>
<body class="piano-app">
<div id="grain"></div>

<header id="topbar">
  <div class="logo-block">
    <div class="logo">VESPER<span>PIANO</span></div>
    <div class="logo-sub">ROBOT PIANIST VESPER-01 — AI PIANO COMPOSER</div>
  </div>
  <div class="transport">
    <button id="btn-rew" class="tbtn" title="先頭へ (Home)">⏮</button>
    <button id="btn-play" class="tbtn play" title="再生/停止 (Space)">▶</button>
    <button id="btn-stop" class="tbtn" title="停止">■</button>
    <button id="btn-loop" class="tbtn" title="ループ">⟲</button>
    <button id="btn-met" class="tbtn met" title="メトロノーム (M)">♩</button>
    <div class="lcd"><span id="pos-display">001.1</span><span class="lcd-dim" id="time-display">0:00.0</span></div>
    <label class="tfield"><span>BPM</span><input id="inp-tempo" type="number" min="30" max="300" step="1" value="90" /></label>
    <label class="tfield"><span>拍子</span><select id="inp-timesig"><option value="4">4/4</option><option value="3">3/4</option><option value="6">6/8*</option></select></label>
    <label class="tfield"><span>キー</span><input id="inp-key" type="text" value="C major" size="8" /></label>
    <label class="tfield"><span>スナップ</span><select id="inp-snap"><option value="1">1/4</option><option value="0.5">1/8</option><option value="0.25" selected>1/16</option><option value="0.125">1/32</option><option value="0.3333">1/8T</option><option value="0">OFF</option></select></label>
    <label class="tfield hand"><span>手</span><select id="inp-hand" title="新しく置く音符の手"><option value="R">右 R</option><option value="L">左 L</option></select></label>
  </div>
  <div class="topbar-right">
    <label class="tfield master"><span>VOL</span><input id="inp-master" type="range" min="-40" max="6" step="0.5" value="-4" /></label>
    <div class="btn-group">
      <button id="btn-humanize" class="gbtn tiny" title="ヒューマナイズ">人間味</button>
      <button id="btn-quantize" class="gbtn tiny" title="クオンタイズ">Q</button>
      <button id="btn-check" class="gbtn tiny" title="運指を検査 (弾けるか)">検査</button>
    </div>
    <div class="btn-group">
      <button id="btn-export" class="gbtn tiny" title="MIDI 書き出し (ペダル CC64 付き)">MIDI</button>
      <button id="btn-export-wav" class="gbtn tiny" title="WAV 書き出し">WAV</button>
      <button id="btn-save" class="gbtn tiny" title="保存">保存</button>
      <button id="btn-menu" class="gbtn tiny" title="曲の管理">☰</button>
      <button id="btn-settings" class="gbtn tiny" title="設定 (API キー / モデル / 言語)">⚙</button>
      <a class="gbtn tiny" href="../" title="BLUE GARAGE STUDIO (フルのシーケンサー)">STUDIO</a>
    </div>
  </div>
</header>

<div id="workspace">
  <main id="center">
    <div id="arrange-wrap"><canvas id="arrange"></canvas></div>
    <div id="proll-head">
      <span id="proll-title">PIANO ROLL</span>
      <span class="legend"><i class="sw r"></i>右手 <i class="sw l"></i>左手 <i class="sw p"></i>ペダル</span>
      <span id="proll-hint">クリック=追加 / ドラッグ=移動 / 右端=長さ / ⌥クリック=削除 / ⌘ドラッグ=範囲選択 / 1〜5=指 / L R=手 / P=選択範囲にペダル / ⌘C ⌘V ⌘D / ←→↑↓</span>
    </div>
    <div id="proll-wrap" class="view view-active"><canvas id="proll"></canvas></div>
  </main>

  <aside id="aipanel">
    <div id="stage" class="hidden">
      <canvas id="stage-canvas"></canvas>
      <div id="stage-hud"><span id="stage-title"></span><span id="stage-info"></span></div>
      <div id="stage-pedal" title="サスティンペダル">PEDAL</div>
      <button id="btn-stage-chat" class="gbtn tiny" title="チャットに戻る">CHAT</button>
    </div>
    <div id="chatwrap">
      <div class="panel-head blue">
        <span>AI PIANIST</span>
        <span class="ai-badge">Claude Opus 5</span>
        <button id="btn-stage-show" class="gbtn tiny" title="VESPER を見る">VESPER</button>
        <button id="btn-chat-clear" class="gbtn tiny" title="会話を消す (曲は残る)">クリア</button>
      </div>
      <div id="chat-log"></div>
      <div id="chat-input-wrap">
        <textarea id="chat-input" rows="2" placeholder="例: 雨の日の午後、静かで少し切ないピアノ曲。坂本龍一みたいに"></textarea>
        <button id="btn-chat-send" class="gbtn accent" title="送信 (Enter)">送信</button>
      </div>
    </div>
  </aside>
</div>

<dialog id="dlg-menu" class="wide">
  <h3>曲の管理</h3>
  <div class="lib-top">
    <button id="btn-new-song" class="gbtn small accent">新規</button>
    <button id="btn-save-as" class="gbtn small">名前を付けて保存 (複製)</button>
    <button id="btn-export-json" class="gbtn small">JSON 書き出し</button>
    <label class="gbtn small file-label"><span>JSON 読み込み</span><input id="inp-import-json" type="file" accept=".json" hidden /></label>
  </div>
  <div id="lib-list" class="lib-list"></div>
  <div class="dlg-foot"><button id="btn-menu-close" class="gbtn small">閉じる</button></div>
</dialog>

<dialog id="dlg-settings">
  <h3 data-i18n="dlg.settings">設定</h3>
  <div class="dlg-body form">
    <p id="set-server-note" class="dim"></p>
    <label><span data-i18n="set.key">Anthropic API キー</span><input id="set-key" type="password" placeholder="sk-ant-…" autocomplete="off" /></label>
    <p class="dim" data-i18n="set.key.help"></p>
    <p class="dim"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" data-i18n="set.key.get"></a></p>
    <label><span data-i18n="set.model">モデル</span><select id="set-model"></select></label>
    <label><span data-i18n="set.lang">表示言語</span><select id="set-lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
    <div class="row"><button id="btn-set-test" class="gbtn small" data-i18n="set.test">接続テスト</button><span id="set-status"></span></div>
  </div>
  <div class="dlg-foot"><button id="btn-set-close" class="gbtn small" data-i18n="dlg.close">閉じる</button> <button id="btn-set-save" class="gbtn small accent" data-i18n="set.save">保存</button></div>
</dialog>

<div id="toast"></div>
<div id="loader" class="hidden"><div class="loader-inner"><div class="spinner"></div><span id="loader-text">…</span></div></div>

<script type="module" src="piano.js"></script>
</body>
</html>
