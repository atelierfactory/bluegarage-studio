<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLUE GARAGE STUDIO — AI SEQUENCER</title>
<!-- 外の CDN は使わない (会社サイトの CSP に合わせて同梱): フォント 3 種は vendor/fonts、Tone.js 14.7.77 は vendor/Tone.js -->
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<link rel="stylesheet" href="style.css" />
<script src="vendor/Tone.js"></script>
</head>
<body>
<div id="grain"></div>

<!-- ═══════════ HEADER / TRANSPORT ═══════════ -->
<header id="topbar">
  <div class="logo-block">
    <div class="logo">BLUE<span>GARAGE</span></div>
    <div class="logo-sub" data-i18n="app.sub">SANGENJAYA UNDERGROUND — AI SEQUENCER</div>
  </div>

  <div class="transport">
    <button id="btn-rew" class="tbtn" data-i18n-title="tr.rew">⏮</button>
    <button id="btn-play" class="tbtn play" data-i18n-title="tr.play">▶</button>
    <button id="btn-stop" class="tbtn" data-i18n-title="tr.stop">■</button>
    <button id="btn-loop" class="tbtn" data-i18n-title="tr.loop">⟲</button>
    <button id="btn-rec" class="tbtn rec" data-i18n-title="tr.rec">●</button>
    <button id="btn-met" class="tbtn met" data-i18n-title="tr.met">♩</button>
    <div class="lcd">
      <span id="pos-display">001.1</span>
      <span class="lcd-dim" id="time-display">0:00.0</span>
    </div>
    <label class="tfield"><span data-i18n="tr.bpm">BPM</span>
      <input id="inp-tempo" type="number" min="30" max="300" step="1" value="120" />
    </label>
    <label class="tfield"><span data-i18n="tr.timesig">拍子</span>
      <select id="inp-timesig">
        <option value="4">4/4</option>
        <option value="3">3/4</option>
        <option value="6">6/8*</option>
      </select>
    </label>
    <label class="tfield"><span data-i18n="tr.key">キー</span>
      <input id="inp-key" type="text" value="A minor" size="8" />
    </label>
    <label class="tfield"><span data-i18n="tr.snap">スナップ</span>
      <select id="inp-snap">
        <option value="1">1/4</option>
        <option value="0.5">1/8</option>
        <option value="0.25" selected>1/16</option>
        <option value="0.125">1/32</option>
        <option value="0.3333">1/8T</option>
        <option value="0">OFF</option>
      </select>
    </label>
  </div>

  <div class="topbar-right">
    <label class="tfield master"><span data-i18n="tr.master">MASTER</span>
      <input id="inp-master" type="range" min="-40" max="6" step="0.5" value="-4" />
    </label>
    <div class="btn-group">
      <button id="btn-humanize" class="gbtn tiny" data-i18n="btn.humanize" data-i18n-title="btn.humanize.t">人間味</button>
      <button id="btn-quantize" class="gbtn tiny" data-i18n-title="btn.quantize.t">Q</button>
      <button id="btn-mixer" class="gbtn tiny" data-i18n="btn.mixer" data-i18n-title="btn.mixer.t">MIX</button>
    </div>
    <div class="btn-group">
      <button id="btn-export" class="gbtn tiny" data-i18n="btn.midi" data-i18n-title="btn.midi.t">MIDI</button>
      <button id="btn-export-wav" class="gbtn tiny" data-i18n="btn.wav" data-i18n-title="btn.wav.t">WAV</button>
      <button id="btn-save" class="gbtn tiny" data-i18n="btn.save" data-i18n-title="btn.save.t">保存</button>
      <button id="btn-menu" class="gbtn tiny" data-i18n-title="btn.menu.t">☰</button>
      <button id="btn-settings" class="gbtn tiny" data-i18n-title="btn.settings.t">⚙</button>
    </div>
  </div>
</header>

<!-- ═══════════ MAIN ═══════════ -->
<div id="workspace">
  <aside id="tracklist">
    <div class="panel-head">
      <span data-i18n="panel.tracks">TRACKS</span>
      <button id="btn-add-track" class="gbtn small accent" data-i18n="btn.addtrack">+ 追加</button>
    </div>
    <div id="track-strips"></div>
  </aside>

  <main id="center">
    <div id="arrange-wrap"><canvas id="arrange"></canvas></div>
    <div id="proll-head">
      <div id="view-tabs">
        <button class="vtab on" data-view="proll" data-i18n="proll.title">PIANO ROLL</button>
        <button class="vtab" data-view="rack">RACK</button>
        <button class="vtab" data-view="mixer">MIXER</button>
      </div>
      <span id="proll-hint" data-i18n="proll.hint"></span>
    </div>
    <div id="proll-wrap" class="view view-active"><canvas id="proll"></canvas></div>
    <div id="rack" class="view"></div>
    <div id="mixer" class="view"></div>
  </main>

  <aside id="aipanel">
    <div class="panel-head blue">
      <span data-i18n="ai.title">AI SESSION</span>
      <span class="ai-badge">Claude Opus 5</span>
      <button id="btn-chat-clear" class="gbtn tiny" data-i18n="ai.clear" data-i18n-title="ai.clear.t">クリア</button>
    </div>
    <div id="chat-log"></div>
    <div id="chat-input-wrap">
      <textarea id="chat-input" rows="2" data-i18n-ph="chat.ph"></textarea>
      <button id="btn-chat-send" class="gbtn accent" data-i18n="chat.send" data-i18n-title="chat.send.t">送信</button>
    </div>
  </aside>
</div>

<!-- project menu -->
<dialog id="dlg-menu" class="wide">
  <h3 data-i18n="dlg.library">曲の管理</h3>
  <div class="lib-top">
    <button id="btn-new-song" class="gbtn small accent" data-i18n="dlg.new">新規プロジェクト</button>
    <button id="btn-save-as" class="gbtn small" data-i18n="lib.saveas">名前を付けて保存 (複製)</button>
    <button id="btn-export-json" class="gbtn small" data-i18n="dlg.exportjson">JSON 書き出し</button>
    <label class="gbtn small file-label"><span data-i18n="dlg.importjson">JSON 読み込み</span><input id="inp-import-json" type="file" accept=".json" hidden /></label>
    <button id="btn-demo" class="gbtn small" data-i18n="dlg.demo">デモ曲</button>
  </div>
  <div id="lib-list" class="lib-list"></div>
  <div class="dlg-foot"><button id="btn-menu-close" class="gbtn small" data-i18n="dlg.close">閉じる</button></div>
</dialog>

<!-- settings -->
<dialog id="dlg-settings">
  <h3 data-i18n="dlg.settings">設定</h3>
  <div class="dlg-body form">
    <p id="set-server-note" class="dim"></p>
    <label><span data-i18n="set.key">Anthropic API キー</span><input id="set-key" type="password" placeholder="sk-ant-…" autocomplete="off" /></label>
    <p class="dim" data-i18n="set.key.help"></p>
    <p class="dim"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" data-i18n="set.key.get"></a></p>
    <div id="set-pass-row" hidden>
      <label><span data-i18n="set.pass">アクセスコード</span><input id="set-pass" type="password" autocomplete="off" /></label>
      <p class="dim" data-i18n="set.pass.help"></p>
    </div>
    <label><span data-i18n="set.model">モデル</span><select id="set-model"></select></label>
    <label><span data-i18n="set.lang">表示言語</span><select id="set-lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
    <div class="row"><button id="btn-set-test" class="gbtn small" data-i18n="set.test">接続テスト</button><span id="set-status"></span></div>
  </div>
  <div class="dlg-foot"><button id="btn-set-close" class="gbtn small" data-i18n="dlg.close">閉じる</button> <button id="btn-set-save" class="gbtn small accent" data-i18n="set.save">保存</button></div>
</dialog>

<!-- master / mix -->
<dialog id="dlg-master">
  <h3 data-i18n="dlg.master">マスター / ミックス</h3>
  <div class="dlg-body form">
    <label><span data-i18n="mx.glue"></span><input id="mx-glue" type="range" min="0" max="1" step="0.02" /><em></em></label>
    <label><span data-i18n="mx.hall"></span><input id="mx-hall" type="range" min="0.5" max="8" step="0.1" /><em></em></label>
    <label><span data-i18n="mx.room"></span><input id="mx-room" type="range" min="0.15" max="2" step="0.05" /><em></em></label>
    <label><span data-i18n="mx.lufs"></span><input id="mx-lufs" type="range" min="-24" max="-6" step="0.5" /><em></em></label>
    <label><span data-i18n="mx.width"></span><input id="mx-width" type="range" min="0.5" max="1.5" step="0.05" /><em></em></label>
    <div class="row"><button id="btn-master-automix" class="gbtn small accent" data-i18n="mx.automix"></button><button id="btn-master-reset" class="gbtn small" data-i18n="mx.reset"></button></div>
    <label class="col"><span data-i18n="mx.tempomap"></span><div class="row"><input id="mx-tempomap" type="text" placeholder="33.0=104 36.0=80" /><button id="btn-tempomap-apply" class="gbtn small" data-i18n="mx.tempomap.apply"></button></div></label>
  </div>
  <div class="dlg-foot"><button id="btn-master-close" class="gbtn small" data-i18n="dlg.close">閉じる</button></div>
</dialog>

<!-- synth patch -->
<dialog id="dlg-synth" class="wide">
  <h3 data-i18n="dlg.synth">シンセ音色</h3>
  <div class="syn-top">
    <label><span data-i18n="syn.preset">プリセット</span><select id="synth-preset"></select></label>
    <input id="synth-name" type="text" placeholder="name" />
    <button id="btn-synth-audition" class="gbtn small" data-i18n="syn.audition">試聴</button>
    <button id="btn-synth-copy" class="gbtn small" data-i18n="syn.copy">JSON</button>
  </div>
  <div class="syn-ai"><input id="synth-ai-input" type="text" data-i18n-ph="syn.ai" /><button id="btn-synth-ai" class="gbtn small accent" data-i18n="syn.ai.go"></button></div>
  <p id="synth-desc" class="dim"></p>
  <div id="synth-body"></div>
  <div class="dlg-foot"><button id="btn-synth-close" class="gbtn small" data-i18n="dlg.close">閉じる</button></div>
</dialog>

<!-- MIDI out -->
<dialog id="dlg-midi">
  <h3 data-i18n="dlg.midi">MIDI 出力</h3>
  <div class="dlg-body form">
    <p><b id="midi-track-name"></b></p>
    <label><span data-i18n="midi.port">ポート</span><select id="midi-port"></select></label>
    <label><span data-i18n="midi.ch">チャンネル</span><input id="midi-ch" type="number" min="1" max="16" value="1" /></label>
    <label class="row"><input id="midi-silent" type="checkbox" /><span data-i18n="midi.silent"></span></label>
    <p class="dim" data-i18n="midi.help"></p>
  </div>
  <div class="dlg-foot"><button id="btn-midi-close" class="gbtn small" data-i18n="dlg.close">閉じる</button> <button id="btn-midi-ok" class="gbtn small accent">OK</button></div>
</dialog>

<div id="toast"></div>
<div id="loader" class="hidden"><div class="loader-inner"><div class="spinner"></div><span id="loader-text">…</span></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
